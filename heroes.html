<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hero Guides | Gods of Alliance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070707;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    height: 78px;
    background: rgba(5,5,5,0.98);
    border-bottom: 1px solid #252525;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
}

.brand {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 2px;
}

.brand span {
    color: #e9a923;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.3px;
}

nav a:hover {
    color: #e9a923;
}

/* HERO SECTION */

main {
    max-width: 1500px;
    margin: auto;
    padding: 75px 35px 90px;
}

.hero-header {
    text-align: center;
    margin-bottom: 55px;
}

.label {
    color: #e9a923;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 20px;
}

.hero-header h1 {
    font-size: clamp(42px, 5vw, 68px);
    font-weight: 900;
    margin-bottom: 25px;
}

.hero-header p {
    color: #b9b9b9;
    font-size: 17px;
    line-height: 1.7;
    max-width: 800px;
    margin: auto;
}

/* SEARCH */

.hero-search {
    max-width: 600px;
    margin: 35px auto 0;
}

.hero-search input {
    width: 100%;
    background: #111;
    border: 1px solid #292929;
    color: white;
    padding: 17px 20px;
    font-size: 15px;
    border-radius: 4px;
    outline: none;
}

.hero-search input:focus {
    border-color: #e9a923;
}

.hero-search input::placeholder {
    color: #777;
}

/* GRID */

.hero-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 25px;
}

.hero-card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 5px;
    overflow: hidden;
    text-decoration: none;
    color: white;
    transition: 0.2s;
    min-width: 0;
}

.hero-card:hover {
    border-color: #e9a923;
    transform: translateY(-4px);
}

.hero-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0b0b0b;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.hero-placeholder {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #555;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
}

.hero-placeholder span {
    color: #e9a923;
    font-size: 25px;
    margin-bottom: 8px;
}

.hero-name {
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

/* FOOTER */

footer {
    border-top: 1px solid #222;
    text-align: center;
    color: #666;
    padding: 28px;
    font-size: 12px;
}

/* RESPONSIVE */

@media (max-width: 1100px) {
    .hero-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 850px) {
    .hero-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 600px) {
    header {
        padding: 0 5%;
    }

    .brand {
        font-size: 15px;
    }

    main {
        padding: 50px 16px 70px;
    }

    .hero-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .hero-name {
        font-size: 13px;
        min-height: 52px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        GODS OF <span>ALLIANCE</span>
    </div>

    <nav>
        <a href="index.html">HOME</a>
    </nav>
</header>

<main>

    <section class="hero-header">

        <div class="label">GODS OF ALLIANCE DATABASE</div>

        <h1>HERO GUIDES</h1>

        <p>
            Explore our Hero Wars Alliance hero database. Select a hero to discover
            skills, builds, glyphs, skins, team synergies, strengths, weaknesses
            and battle strategies.
        </p>

        <div class="hero-search">
            <input
                type="text"
                id="heroSearch"
                placeholder="Search for a hero..."
                autocomplete="off"
            >
        </div>

    </section>

    <section class="hero-grid" id="heroGrid"></section>

</main>

<footer>
    © 2026 Gods of Alliance • Hero Wars Alliance Guides
</footer>

<script>

/*
==========================================================
HERO DATABASE
==========================================================

IMPORTANT:
The image filename is defined here ONCE.

When an image is uploaded to:
Images/Heroes/

the website will automatically display it.

Future individual guides can be connected by replacing "#"
with the guide page.
*/

const heroes = [

    ["Aidan", "aidan.png"],
    ["Alvanor", "Alvanor.png"],
    ["Amira", "Amira.png"],
    ["Andvari", "Andvari.png"],
    ["Arachne", "arachne.png"],
    ["Artemis", "artemis.png"],
    ["Astaroth", "Astaroth.png"],
    ["Astrid and Lucas", "Astrid.png"],
    ["Aurora", "Aurora.png"],

    ["Byrna", "byrna.png"],

    ["Cascade", "cascade.png"],
    ["Celeste", "celeste.png"],
    ["Chabba", "chabba.png"],
    ["Cleaver", "cleaver.png"],
    ["Cornelius", "cornelius.png"],
    ["Corvus", "corvus.png"],
    ["Crow", "crow.png"],

    ["Dante", "dante.png"],
    ["Daredevil", "daredevil.png"],
    ["Dark Star", "dark-star.png"],
    ["Dorian", "dorian.png"],
    ["Drayne", "drayne.png"],

    ["Electra Von Grave", "electra-von-grave.png"],
    ["Elmir", "elmir.png"],
    ["Eva", "eva.png"],

    ["Faceless", "faceless.png"],
    ["Fafnir", "fafnir.png"],
    ["Folio", "folio.png"],
    ["Fox", "fox.png"],

    ["Galahad", "galahad.png"],
    ["Ginger", "ginger.png"],
    ["Guus", "guus.png"],

    ["Heidi", "heidi.png"],
    ["Helios", "helios.png"],

    ["Iris", "iris.png"],
    ["Isaac", "isaac.png"],
    ["Ishmael", "ishmael.png"],

    ["Jet", "jet.png"],
    ["Jhu", "jhu.png"],
    ["Jorgen", "jorgen.png"],
    ["Judge", "judge.png"],
    ["Julius", "julius.png"],

    ["Kai", "kai.png"],
    ["K'arkh", "karkh.png"],
    ["Kayla", "kayla.png"],
    ["Keira", "keira.png"],
    ["Kendle", "kendle.png"],
    ["Krista", "krista.png"],

    ["Lara Croft", "lara-croft.png"],
    ["Lars", "lars.png"],
    ["Leonel", "leonel.png"],
    ["Lian", "lian.png"],
    ["Lilith", "lilith.png"],
    ["Luther", "luther.png"],

    ["Markus", "markus.png"],
    ["Martha", "martha.png"],
    ["Maya", "maya.png"],
    ["Miu", "miu.png"],
    ["Mojo", "mojo.png"],
    ["Morrigan", "morrigan.png"],
    ["Mushy and Shroom", "mushy-and-shroom.png"],

    ["Nebula", "nebula.png"],
    ["Ninja Turtles", "ninja-turtles.png"],

    ["Octavia", "octavia.png"],
    ["Orion", "orion.png"],
    ["Oya", "oya.png"],

    ["Peech", "peech.png"],
    ["Peppy", "peppy.png"],
    ["Phobos", "phobos.png"],
    ["Polaris", "polaris.png"],

    ["Qing Mao", "qing-mao.png"],

    ["Rufus", "rufus.png"],

    ["Satori", "satori.png"],
    ["Sebastian", "sebastian.png"],
    ["Soleil", "soleil.png"],
    ["Somna", "somna.png"],

    ["Tempus", "tempus.png"],
    ["Thea", "thea.png"],
    ["Tristan", "tristan.png"],

    ["Xe'Sha", "xesha.png"],

    ["Yasmine", "yasmine.png"],

    ["Ziri", "ziri.png"]

];


/* CREATE HERO CARDS */

const heroGrid = document.getElementById("heroGrid");

heroes.forEach(hero => {

    const name = hero[0];
    const image = hero[1];

    const card = document.createElement("a");

    card.className = "hero-card";
    card.href = "#";
    card.dataset.name = name.toLowerCase();

    const imageContainer = document.createElement("div");
    imageContainer.className = "hero-image";

    const img = document.createElement("img");

    img.src = "Images/Heroes/" + image;
    img.alt = name;
    img.loading = "lazy";

    const placeholder = document.createElement("div");
    placeholder.className = "hero-placeholder";

    placeholder.innerHTML =
        "<span>⚔</span>" +
        "IMAGE COMING SOON";

    img.onerror = function() {
        img.style.display = "none";
        placeholder.style.display = "flex";
    };

    imageContainer.appendChild(img);
    imageContainer.appendChild(placeholder);

    const heroName = document.createElement("div");

    heroName.className = "hero-name";
    heroName.textContent = name;

    card.appendChild(imageContainer);
    card.appendChild(heroName);

    heroGrid.appendChild(card);

});


/* SEARCH */

const heroSearch = document.getElementById("heroSearch");

heroSearch.addEventListener("input", function() {

    const search = this.value.toLowerCase().trim();

    const cards = document.querySelectorAll(".hero-card");

    cards.forEach(card => {

        const heroName = card.dataset.name;

        if (heroName.includes(search)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

});

</script>

</body>
</html>
