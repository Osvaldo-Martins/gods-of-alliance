<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hero Guides | Gods of Alliance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070707;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    height: 105px;
    border-bottom: 1px solid #242424;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    background: #050505;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ffffff;
}

.logo span {
    color: #f5a900;
}

.home-link {
    color: #ffffff;
    text-decoration: none;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 2px;
    transition: 0.2s;
}

.home-link:hover {
    color: #f5a900;
}

/* HERO SECTION */

.hero-intro {
    text-align: center;
    padding: 75px 20px 55px;
}

.eyebrow {
    color: #f5a900;
    font-size: 14px;
    letter-spacing: 7px;
    font-weight: 900;
    margin-bottom: 35px;
}

h1 {
    font-size: clamp(42px, 6vw, 70px);
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.description {
    max-width: 780px;
    margin: auto;
    color: #b9b9b9;
    font-size: 17px;
    line-height: 1.7;
}

/* HERO GRID */

.hero-grid {
    width: 90%;
    max-width: 1400px;
    margin: 0 auto 100px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 26px;
}

.hero-card {
    background: #0c0c0c;
    border: 1px solid #292929;
    border-radius: 5px;
    overflow: hidden;
    text-decoration: none;
    color: white;
    transition: 0.2s ease;
}

.hero-card:hover {
    border-color: #f5a900;
    transform: translateY(-4px);
}

.hero-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #090909;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #090909;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.placeholder-icon {
    color: #f5a900;
    font-size: 25px;
}

.placeholder-text {
    color: #5d626a;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
}

.hero-name {
    min-height: 64px;
    background: #101010;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* FOOTER */

footer {
    border-top: 1px solid #222;
    padding: 35px 20px;
    text-align: center;
    color: #777;
    font-size: 13px;
    letter-spacing: 1px;
}

/* RESPONSIVE */

@media (max-width: 1100px) {
    .hero-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 850px) {
    .hero-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 600px) {
    header {
        padding: 0 5%;
    }

    .logo {
        font-size: 18px;
        letter-spacing: 2px;
    }

    .hero-grid {
        width: 92%;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    .hero-intro {
        padding-top: 55px;
    }

    .hero-name {
        font-size: 13px;
    }
}
</style>
</head>

<body>
